org.gradle.jvmargs=-Xmx512m
org.gradle.parallel=true
org.gradle.configuration-cache=false

# ---- Build target -------------------------------------------------------
# One jar is compiled against 1.21.8 and runs on 1.21.6 - 1.21.11, because
# every class/method this mod touches keeps the same intermediary name across
# that range. To verify the other versions compile, override on the CLI, e.g.:
#   ./gradlew build -Pminecraft_version=1.21.11 -Pyarn_mappings=<yarn> -Pfabric_version=<fabric-api>
# Look up the exact coordinates at https://fabricmc.net/develop (verify before use).
minecraft_version=1.21.8
yarn_mappings=1.21.8+build.1
loader_version=0.17.2
fabric_version=0.136.0+1.21.8

# ---- Mod properties -----------------------------------------------------
mod_version=1.0.0
maven_group=dev.dialogguard
archives_base_name=dialogguard
